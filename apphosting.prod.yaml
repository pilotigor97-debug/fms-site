# Firebase App Hosting config — ambiente PROD do fms-site (opspilot-prod).
# Carregado quando o backend tiver `environment: prod` setado.
#
# Backend `fms-site-1` em opspilot-prod / us-east4 usa esse arquivo
# (sobrescreve apphosting.yaml).
#
# Custom domain: getfms.pro
# App Flutter relacionado: https://app.getfms.pro (opspilot-prod hosting)

runConfig:
  minInstances: 0
  maxInstances: 10
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  # ─── Públicas (vão pro client bundle Next.js) ────────────────
  - variable: NEXT_PUBLIC_ROOT_DOMAIN
    value: getfms.pro
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_URL
    # URL do app Flutter (subdomain dedicado) em prod
    value: https://app.getfms.pro
    availability:
      - BUILD
      - RUNTIME

  # ─── Server-side ─────────────────────────────────────────────
  - variable: FIREBASE_PROJECT_ID
    value: opspilot-prod
    availability:
      - RUNTIME

  - variable: FIREBASE_WEB_API_KEY
    # Web API Key do projeto opspilot-prod (de lib/firebase_options_prod.dart)
    value: AIzaSyCVsn_IFMR2XatRxuQgJvRs0RED2or4tjA
    availability:
      - RUNTIME

  # ─── Firebase Web SDK (client bundle) ────────────────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCVsn_IFMR2XatRxuQgJvRs0RED2or4tjA
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: opspilot-prod.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: opspilot-prod
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:457560136646:web:75accfd7e474d0b710f0c7
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: opspilot-prod.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: SALES_LEAD_EMAIL
    # Pode ser o mesmo do dev por enquanto. Atualizar se quiser email
    # dedicado pra leads prod.
    value: fms.saas@gmail.com
    availability:
      - RUNTIME

  # ─── Secrets (Secret Manager opspilot-prod) ──────────────────
  # Setados via: firebase apphosting:secrets:set <NAME> --project opspilot-prod
  # Acesso já concedido ao backend (firebase-app-hosting-compute@opspilot-prod).
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - RUNTIME

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME
